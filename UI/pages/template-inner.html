<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LifeTrack — Dashboard overview of your wellness metrics">
  <title>LifeTrack — Dashboard</title>
  <link rel="stylesheet" href="../shared/styles/main.css">
  <!-- 
    ╔═══════════════════════════════════════════════════════════╗
    ║  INNER PAGE TEMPLATE                                     ║
    ║  Use for: Dashboard, Daily Log, Expenses, Journal,       ║
    ║           Trends, Admin                                  ║
    ║  Layout: app-shell (sidebar + topnav + content area)     ║
    ║  Grid: grid--3 (or grid--2 / grid--auto as needed)       ║
    ║                                                          ║
    ║  HOW TO CUSTOMIZE:                                       ║
    ║  1. Change <title> and meta description                  ║
    ║  2. Update sidebar active item (add sidebar__nav-item--active) ║
    ║  3. Update topnav active link (add topnav__link--active) ║
    ║  4. Replace grid content with your page cards            ║
    ║  5. Add page-specific CSS in a <style> block if needed   ║
    ╚═══════════════════════════════════════════════════════════╝
  -->
</head>
<body>

  <div class="app-shell">
    <!-- Decorative overlay -->
    <div class="botanical-overlay"></div>

    <!-- ═══════════════════════════════════════════
         SIDEBAR  (copy exactly — don't modify)
         ═══════════════════════════════════════════ -->
    <aside class="sidebar">
      <!-- Logo -->
      <div class="sidebar__header">
        <a href="dashboard.html" class="sidebar__logo">
          <svg class="sidebar__logo-mark" width="28" height="28" viewBox="0 0 32 32" fill="none">
            <path d="M16 2C14 8 8 14 4 18C8 17 12 18 14 22C14 18 16 12 22 6C20 8 18 6 16 2Z" fill="#241F1A"/>
          </svg>
          <span class="sidebar__logo-text">LifeTrack</span>
        </a>
      </div>

      <!-- Navigation -->
      <nav class="sidebar__nav" aria-label="Main navigation">
        <ul class="sidebar__nav-list">
          <li>
            <a href="dashboard.html" class="sidebar__nav-item sidebar__nav-item--active">
              <span class="sidebar__nav-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
              </span>
              <span class="sidebar__nav-label">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="daily-log.html" class="sidebar__nav-item">
              <span class="sidebar__nav-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="14" height="16" rx="2"/><path d="M7 6h6M7 10h6M7 14h4"/></svg>
              </span>
              <span class="sidebar__nav-label">Daily Log</span>
            </a>
          </li>
          <li>
            <a href="analytics.html" class="sidebar__nav-item">
              <span class="sidebar__nav-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="10" width="4" height="8" rx="1"/><rect x="8" y="6" width="4" height="12" rx="1"/><rect x="14" y="2" width="4" height="16" rx="1"/></svg>
              </span>
              <span class="sidebar__nav-label">Analytics</span>
            </a>
          </li>
          <li>
            <a href="expenses.html" class="sidebar__nav-item">
              <span class="sidebar__nav-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M10 5v10M7.5 7.5h5M7 12.5h6"/></svg>
              </span>
              <span class="sidebar__nav-label">Expenses</span>
            </a>
          </li>
          <li>
            <a href="journal.html" class="sidebar__nav-item">
              <span class="sidebar__nav-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h12a2 2 0 012 2v12a2 2 0 01-2 2H4V2z"/><path d="M8 6h6M8 10h4"/></svg>
              </span>
              <span class="sidebar__nav-label">Journal</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- User block -->
      <div class="sidebar__user">
        <div class="sidebar__avatar avatar avatar--md avatar--fallback">AJ</div>
        <span class="sidebar__username">Alex J.</span>
      </div>
    </aside>


    <!-- ═══════════════════════════════════════════
         TOP NAVIGATION  (copy exactly — just change active link)
         ═══════════════════════════════════════════ -->
    <nav class="topnav" aria-label="Top navigation">
      <div class="topnav__left">
        <!-- Optional: page title for pages like "Expenses Page" -->
        <!-- <h1 class="topnav__page-title">Expenses Page</h1> -->
      </div>

      <div class="topnav__links">
        <a href="#" class="topnav__link topnav__link--active">Overview</a>
        <a href="#" class="topnav__link">History</a>
        <a href="#" class="topnav__link">Profile</a>
        <a href="#" class="topnav__link">Insights</a>
      </div>

      <div class="topnav__right">
        <!-- Optional: action button like "Log New Expense" -->
        <!-- <button class="topnav__action-btn">Log New Expense</button> -->
        <span class="topnav__user-name">Alex J.</span>
        <div class="topnav__avatar avatar avatar--sm avatar--fallback" style="font-size: 10px;">AJ</div>
      </div>
    </nav>


    <!-- ═══════════════════════════════════════════
         MAIN CONTENT  (customize this part)
         ═══════════════════════════════════════════ -->
    <main class="app-main">
      <div class="app-main__content">

        <!-- Page heading (optional — some pages use topnav title instead) -->
        <h1 class="page-title" style="margin-bottom: var(--space-6);">Dashboard</h1>

        <!-- Content grid — change grid--3 to grid--2 or grid--auto as needed -->
        <div class="grid grid--3">

          <!-- Card 1: Quick Actions -->
          <div class="card">
            <div class="card__header">
              <h2 class="card__title">Quick Actions</h2>
            </div>
            <div class="card__body">
              <button class="btn btn--secondary btn--full">New Goal</button>
              <button class="btn btn--secondary btn--full">Log Wellness</button>
              <button class="btn btn--primary btn--full">Log Wellness</button>
            </div>
          </div>

          <!-- Card 2: Chart placeholder -->
          <div class="card col-span-1">
            <div class="card__header">
              <h2 class="card__title">Weekly Sleep Duration</h2>
              <div class="flex gap-2">
                <span class="chip chip--sage">Sleep Health</span>
                <span class="chip chip--sage">Optimal</span>
              </div>
            </div>
            <div class="card__body">
              <!-- YOUR CHART GOES HERE (Chart.js, D3, or plain canvas) -->
              <div style="height:200px; background: var(--sand-50); border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center; color: var(--taupe-400);">
                📊 Chart placeholder
              </div>
            </div>
          </div>

          <!-- Card 3: Another card -->
          <div class="card">
            <div class="card__header">
              <h2 class="card__title">Financial Wellness</h2>
            </div>
            <div class="card__body">
              <div style="height:200px; background: var(--sand-50); border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center; color: var(--taupe-400);">
                🍩 Donut chart placeholder
              </div>
            </div>
          </div>

        </div><!-- /.grid -->

      </div><!-- /.app-main__content -->
    </main>

  </div><!-- /.app-shell -->

  <!-- Toast container (all pages should include this) -->
  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
