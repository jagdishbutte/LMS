<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LifeTrack — Sign in to your account">
  <title>LifeTrack — Login</title>
  <link rel="stylesheet" href="../shared/styles/main.css">
  <!-- 
    ╔═══════════════════════════════════════════════════════════╗
    ║  AUTH PAGE TEMPLATE                                      ║
    ║  Use for: Login, Register                                ║
    ║  Layout: app-shell--auth (centered card, no sidebar)     ║
    ║  Inputs: form-input--auth (bottom-border style)          ║
    ╚═══════════════════════════════════════════════════════════╝
  -->
</head>
<body>

  <div class="app-shell--auth">
    <!-- Decorative overlays -->
    <div class="botanical-overlay"></div>
    <div class="mesh-overlay"></div>

    <!-- Auth Card -->
    <div class="card card--auth">
      <!-- Logo -->
      <a href="index.html" class="sidebar__logo" style="margin-bottom: var(--space-6);">
        <svg class="sidebar__logo-mark" width="28" height="28" viewBox="0 0 32 32" fill="none">
          <path d="M16 2C14 8 8 14 4 18C8 17 12 18 14 22C14 18 16 12 22 6C20 8 18 6 16 2Z" fill="#241F1A"/>
        </svg>
        <span class="sidebar__logo-text">LifeTrack</span>
      </a>

      <!-- Title -->
      <h1 class="card__title">Welcome Back</h1>
      <p class="card__subtitle">Sign in to continue your journey toward balance</p>

      <!-- Form -->
      <form class="card__body">
        <div class="form-group">
          <input type="email" class="form-input form-input--auth" placeholder="Email address" id="auth-email" required>
        </div>

        <div class="form-group">
          <div class="form-input-wrapper">
            <input type="password" class="form-input form-input--auth" placeholder="Password" id="auth-password" required style="padding-right: var(--space-10);">
            <span class="form-input-wrapper__suffix" id="togglePassword">Show/e</span>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full mt-6">Sign In</button>
      </form>

      <!-- Footer -->
      <div class="card__footer">
        <span class="text-sm text-secondary">Don't have an account?</span>
        <a href="register.html" class="btn btn--ghost">Register</a>
      </div>

      <!-- Extra link -->
      <div class="text-center mt-4">
        <a href="#" class="btn btn--ghost text-sm">Forgot Password?</a>
      </div>
    </div>
  </div>

</body>
</html>
